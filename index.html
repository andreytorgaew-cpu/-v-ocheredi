<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>В ОЧЕРЕДИ — прототип</title>
<style>
:root{--bg:#171a20;--panel:#232832;--panel2:#2e3541;--text:#f3f4f6;--muted:#aab2bf;--yellow:#ffd34d;--red:#ff6b6b;--green:#6ee7a1;--blue:#6cb5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#3e4654,#171a20 55%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(20px,4vw,30px)}.sub{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1e232c;border:1px solid #3b4350;border-radius:12px;padding:9px 10px}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.bar{height:8px;background:#11151b;border-radius:99px;overflow:hidden}.fill{height:100%;transition:.3s;width:50%;background:var(--green)}#stressFill{background:var(--red)}#moneyFill{background:var(--yellow)}.stage{position:relative;margin-top:12px;height:370px;border-radius:18px;border:1px solid #47505e;overflow:hidden;background:#5b626c;box-shadow:0 12px 32px #0005}.sky{height:76px;background:linear-gradient(#79b7d8,#c9d9c7)}.road{position:absolute;inset:76px 0 0;background:repeating-linear-gradient(90deg,#3d434b 0 90px,#414850 90px 180px)}.road:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 48px,#d6c985 50px 54px,transparent 56px 100px);opacity:.5}.sign{position:absolute;top:15px;left:18px;background:#dce5d4;color:#193126;border:4px solid #2b3c38;border-radius:4px;padding:5px 12px;font-weight:800;z-index:2;transform:rotate(-2deg)}.sun{position:absolute;right:30px;top:16px;width:45px;height:45px;background:#ffe18a;border-radius:50%}.car{position:absolute;width:118px;height:58px;border-radius:17px 17px 11px 11px;border:3px solid #1c2128;z-index:3;box-shadow:0 4px 4px #0007;transition:.35s}.car:before,.car:after{content:'';position:absolute;bottom:-8px;width:18px;height:18px;background:#171a20;border-radius:50%;border:3px solid #777}.car:before{left:14px}.car:after{right:14px}.window{position:absolute;left:28px;top:7px;width:57px;height:22px;background:#b7d6df;border:2px solid #25343e;border-radius:8px}.plate{position:absolute;right:4px;top:23px;background:#f1e8c7;color:#222;font-size:9px;padding:1px 3px}.car.front{left:28%;top:106px;background:#cb6159}.car.player{left:41%;top:206px;background:#477fd1;cursor:pointer}.car.back{left:49%;top:300px;background:#9b68b5}.car.intruder{left:-145px;top:206px;background:#d49b43;animation:drive 2.5s linear forwards;cursor:pointer}.car.intruder:after{background:#171a20}@keyframes drive{to{left:34%}}.label{position:absolute;z-index:5;background:#111b;color:#fff;padding:3px 7px;border-radius:8px;font-size:12px;transform:translate(-50%,-100%);white-space:nowrap}.playerLabel{left:47%;top:205px}.bubble{position:absolute;z-index:6;left:50%;top:102px;max-width:260px;transform:translateX(-50%);background:#fff;color:#222;border-radius:13px;padding:10px 13px;font-weight:650;box-shadow:0 4px 12px #0005}.bubble:after{content:'';position:absolute;bottom:-8px;left:44%;border:8px solid transparent;border-top-color:#fff;border-bottom:0}.event{margin-top:12px;background:var(--panel);border:1px solid #404958;border-radius:16px;padding:14px}.event h2{margin:0 0 4px;font-size:18px}.event p{margin:5px 0 12px;color:#d3d8df}.choices{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:11px;padding:11px 13px;color:#111;font-weight:750;cursor:pointer;background:var(--yellow);transition:.15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn.secondary{background:#d8dee8}.btn.danger{background:#ff8989}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.log{margin-top:10px;color:var(--muted);font-size:13px;min-height:20px}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}.restart{background:transparent;border:1px solid #667080;color:#dce1e8;border-radius:9px;padding:7px 10px;cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.card{max-width:460px;background:#252b35;border:1px solid #667080;border-radius:18px;padding:22px;box-shadow:0 20px 60px #000}.card h1{margin-top:0}.accent{color:var(--yellow)}@media(max-width:600px){.stage{height:330px}.car{transform:scale(.82);transform-origin:left center}.car.player{left:38%}.bubble{font-size:14px;max-width:230px}.stats{gap:5px}.stat{padding:8px 6px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">В ОЧЕРЕДИ</div><div class="sub">Краснодар · АЗС «Южная» · прототип 0.1</div></div><div class="sub" id="turn">Машин до колонки: 8</div></header>
  <section class="stats">
    <div class="stat"><div class="statline"><span>⛽ Бензин</span><b id="fuelText">38 л</b></div><div class="bar"><div id="fuelFill" class="fill"></div></div></div>
    <div class="stat"><div class="statline"><span>🧠 Нервы</span><b id="stressText">24%</b></div><div class="bar"><div id="stressFill" class="fill"></div></div></div>
    <div class="stat"><div class="statline"><span>₽ Деньги</span><b id="moneyText">850</b></div><div class="bar"><div id="moneyFill" class="fill"></div></div></div>
  </section>
  <section class="stage" id="stage"><div class="sky"></div><div class="sun"></div><div class="sign">АЗС «ЮЖНАЯ»<br><small>95-й — пока есть</small></div><div class="road"></div>
    <div class="car front"><div class="window"></div><div class="plate">КРА</div></div>
    <div class="car player" id="playerCar" title="Ваша машина"><div class="window"></div><div class="plate">ВЫ</div></div>
    <div class="car back"><div class="window"></div></div>
    <div class="label playerLabel">ВЫ</div>
    <div class="bubble" id="bubble">Очередь тронулась. Держим строй.</div>
  </section>
  <section class="event"><h2 id="eventTitle">Пока всё спокойно…</h2><p id="eventText">Следи за очередью. Наглецы появляются внезапно.</p><div class="choices" id="choices"><button class="btn" onclick="waitTurn()">Ждать дальше</button></div><div class="log" id="log"></div></section>
  <div class="footer"><span>Цель: добраться до колонки и не сорваться</span><button class="restart" onclick="location.reload()">Начать заново</button></div>
</div>
<div class="modal" id="modal"><div class="card"><h1 id="modalTitle">Доехали!</h1><p id="modalText"></p><button class="btn" onclick="location.reload()">Ещё один раунд</button></div></div>
<script>
let fuel=38, stress=24, money=850, cars=8, eventIndex=0, protection=0, gameOver=false;
const events=[
 {t:'Приора с обочины пытается вклиниться',d:'Водитель моргает аварийкой: «Я тут вообще-то стоял». Машина уже рядом.',b:[['Тап — не пустить',()=>resolve(-1,4,0,'Место сохранено. Приора уехала искать более мягкую очередь.')],['Пропустить',()=>resolve(-1,-3,0,'Пропустили. Вежливо, но теперь перед вами на одну машину больше.')]],intruder:true},
 {t:'Бабушка на Матизе',d:'«Сынок, мне же всего 10 литров. Я быстро».',b:[['Пропустить',()=>resolve(-1,-4,0,'Карма +1. Бабушка благословила вас и заняла место.')],['Отказать',()=>resolve(0,7,0,'Бабушка вздохнула. Нервы подросли, зато место ваше.')]]},
 {t:'Мужик предлагает 500 ₽ за ваше место',d:'За вами уже образовалась мини-очередь. Предложение звучит уверенно.',b:[['Продать',()=>resolve(1,2,500,'Сделка состоялась. Теперь вы почти в хвосте, зато с деньгами.')],['Отказать',()=>resolve(0,3,0,'«Ну и стойте». Стоим.')],['Торговаться за 900 ₽',()=>resolve(1,5,money>=900?900:0,money>=900?'Ударили по рукам за 900 ₽.':'У покупателя только 500 ₽. Он обиделся и уехал.')]]},
 {t:'Сосед спереди уходит в магазин',d:'«Присмотри за машиной, брат? Минутка».',b:[['Присмотреть',()=>{protection++;resolve(0,-5,0,'Сосед вернулся с водой и теперь прикроет вас от одного наглеца.')}],['Не твоя проблема',()=>resolve(0,2,0,'Сосед запомнил. В очереди всё записывается.')]]},
 {t:'Шансон на весь двор',d:'Сосед сзади включает знакомый хит так, будто у него концертный зал.',b:[['Терпеть',()=>resolve(0,9,0,'Вы терпите. Песня заканчивается через 4 минуты (по ощущениям — через 40).')],['Попросить тише',()=>resolve(0,3,0,'Он сделал тише. Кажется, конфликт отменяется.')]]},
 {t:'Сосед предлагает семечки',d:'«Бери, солёные. Нервы лечат».',b:[['Взять',()=>resolve(0,-9,0,'Семечки — главный антистресс очереди.')]]},
 {t:'Слух по очереди: «95-й кончается!»',d:'Кто-то пересылает голосовое из соседнего района. Все завелись.',b:[['Паниковать',()=>resolve(0,13,0,'Газанули, перестроились, посигналили. Слух оказался старым.')],['Не верить',()=>resolve(0,1,0,'Вы сохраняете спокойствие. Пока.')]]},
 {t:'Таксист с двумя канистрами лезет через всю очередь',d:'«Клиенты ждут! У меня люди!» — кричит таксист.',b:[['Тап — общее возмущение',()=>resolve(0,7,0,'Вся очередь просигналила. Таксист отступил.')],['Пропустить',()=>resolve(-1,-2,0,'Его пропустили. Пассажиры благодарно помахали канистрами.')]],intruder:true},
 {t:'Свадебный кортеж просит пропустить три машины',d:'Клаксон, ленты, фотограф из окна. «Нам на праздник!»',b:[['Пропустить',()=>resolve(-3,-3,0,'Карма +2. Кортеж уехал, оставив после себя конфетти.')],['Отказать',()=>resolve(0,5,0,'Праздник продолжается, но уже без вашей помощи.')]]},
 {t:'Кто-то поставил машину и ушёл спать домой',d:'Водитель оставил номер под дворником. До него — три часа ожидания.',b:[['Обойти',()=>resolve(1,9,0,'Рискнули. Сзади одобрительно загудели, спереди — не очень.')],['Ждать',()=>resolve(0,2,0,'Ждём. Машина стоит. Время — тоже.')]]},
 {t:'Заправщик выходит с ограничением',d:'«20 литров в одни руки. Следующий!»',b:[['Понять и простить',()=>resolve(0,2,0,'Правила есть правила. Осталось успеть.')]]},
 {t:'Подъехал экипаж ГАИ',d:'Проверяют документы. Несколько машин внезапно вспомнили о срочных делах.',b:[['Спокойно ждать',()=>resolve(-2,0,0,'Очередь тает на треть. Чудеса порядка.')]]},
 {t:'Друг звонит: на Западном обходе без очереди!',d:'«Бросай всё, тут вообще никого!» Но там новая неизвестная АЗС.',b:[['Уехать',()=>{cars=9;resolve(0,10,-100,'Рискнули и вернулись в новую очередь. Зато опыт бесценен.')}],['Остаться',()=>resolve(0,-2,0,'Остались. Вы уже слишком далеко зашли, чтобы сворачивать.')]]},
 {t:'Сосед предлагает охранника',d:'«Скидываемся по 200 — будет отгонять наглых».',b:[['Скинуться',()=>{if(money>=200){protection+=3;resolve(0,-4,-200,'Охранник встал у въезда. Три наглеца сегодня не пройдут.')}else resolve(0,4,0,'Не хватает денег даже на свисток.')}],['Отказаться',()=>resolve(0,2,0,'Экономно. Но теперь отбиваться придётся самим.')]]}
];
function $(id){return document.getElementById(id)}
function update(){fuel=Math.max(0,fuel);stress=Math.max(0,stress);$('fuelText').textContent=fuel+' л';$('stressText').textContent=stress+'%';$('moneyText').textContent=money+' ₽';$('fuelFill').style.width=Math.min(100,fuel/50*100)+'%';$('stressFill').style.width=stress+'%';$('moneyFill').style.width=Math.min(100,money/1200*100)+'%';$('turn').textContent='Машин до колонки: '+cars;if(fuel<=0)return end('Пустой бак','Вы слишком долго стояли с заведённым мотором. В следующий раз — меньше газовать.');if(stress>=100)return end('Нервы закончились','Вы сорвались и уехали, не дождавшись своей очереди.');if(cars<=0)return end('Заправились!','Вы дошли до колонки. На АЗС осталось '+(fuel>20?'достаточно 95-го.':'только дорогой 100-й.')+' Итог: '+Math.max(0,50-stress)+' очков выдержки.');}
function resolve(c,s,m,msg){if(gameOver)return;if(protection>0&&c>0){protection--;c=0;msg+=' Охранник вмешался.'}cars=Math.max(0,cars+c);stress+=s;money+=m;fuel-=Math.max(1,Math.round(Math.random()*3));$('log').textContent=msg;eventIndex++;update();if(!gameOver)setTimeout(nextEvent,650)}
function waitTurn(){if(gameOver)return;fuel-=2;cars--;stress-=2;$('log').textContent='Очередь продвинулась на одну машину. Держимся.';update();if(!gameOver)setTimeout(nextEvent,650)}
function nextEvent(){if(gameOver)return;let e=events[eventIndex%events.length];$('eventTitle').textContent=e.t;$('eventText').textContent=e.d;$('choices').innerHTML='';e.b.forEach(([txt,fn])=>{let b=document.createElement('button');b.className='btn '+(e.intruder?'danger':'secondary');b.textContent=txt;b.onclick=fn;$('choices').appendChild(b)});$('bubble').textContent=e.intruder?'Эй, куда?! Не лезем!':'Очередь движется…';if(e.intruder){let x=document.createElement('div');x.className='car intruder';x.innerHTML='<div class="window"></div>';x.onclick=()=>resolve(0,-1,0,'Наглец пойман за руку. Очередь одобрительно загудела.');$('stage').appendChild(x);setTimeout(()=>x.remove(),3000)}}
function end(title,text){gameOver=true;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').style.display='flex'}
update();setTimeout(nextEvent,500);
</script>
</body></html>
